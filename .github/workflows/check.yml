name: Verify handbook
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Ensure generated pages are committed
        run: git diff --exit-code -- '*.html' assets/search-index.json assets/quiz.json assets/neural-poster.svg sitemap.xml robots.txt
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm test
